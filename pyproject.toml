[project]
name = "heimdall-cache"
version = "1.3.0"
description = "The All-Seeing Living Semantic Cache for Bifrost Gateway, Powered by Tavily"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.5.0",
    "jinja2>=3.1.4",
    "rich>=13.7.0"
]

[tool.vercel]
entrypoint = "main:app"
